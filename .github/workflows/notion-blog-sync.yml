name: Notion Blog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: notion-blog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATABASE_ID: ${{ secrets.NOTION_BLOG_DATABASE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Missing GitHub secret NOTION_TOKEN. Add the Notion integration token before running this workflow."
            exit 1
          fi
          if [ -z "$NOTION_BLOG_DATABASE_ID" ]; then
            echo "::error::Missing GitHub secret NOTION_BLOG_DATABASE_ID. Use the Blog Posts database id (62c4f7e431b3477aad89da0e6880abcc)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/notion-blog-sync/requirements.txt

      - name: Install sync dependencies
        run: pip install -r scripts/notion-blog-sync/requirements.txt

      - name: Sync Published posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATABASE_ID: ${{ secrets.NOTION_BLOG_DATABASE_ID }}
        run: python scripts/notion-blog-sync/sync.py

      - name: Commit and push synced posts
        run: |
          git config user.name "Rivex Blog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add _posts blog/assets/notion
          git commit -m "chore(blog): sync Published posts from Notion"
          git push origin main
