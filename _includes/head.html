<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
{% if page.description %}
<meta name="description" content="{{ page.description | escape }}">
{% elsif site.description %}
<meta name="description" content="{{ site.description | escape }}">
{% endif %}
{% include og-meta.html %}
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/favicon.webp' | relative_url }}" type="image/webp">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
